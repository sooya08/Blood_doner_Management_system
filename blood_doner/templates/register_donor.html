{% extends 'base.html' %}

{% block title %}Register donor{% endblock %}

{% block content %}
<h1>Register donor</h1>

<form method="post" class="card">
  <label>Name</label>
  <input name="name" required>

  <label>Email</label>
  <input type="email" name="email" required>

  <label>Phone</label>
  <input name="phone" required>

  <label>Blood group</label>
  <select name="blood_group">
    {% for g in groups %}
    <option>{{ g }}</option>
    {% endfor %}
  </select>

  <label>Age</label>
  <input type="number" name="age" min="18" max="65" required>

  <label>Gender</label>
  <select name="gender">
    <option>Male</option>
    <option>Female</option>
  </select>

  <label>Last donation date (optional)</label>
  <input type="date" name="last_donation_date" max="{{ today }}">

  <button>Register donor</button>
</form>
{% endblock %}
