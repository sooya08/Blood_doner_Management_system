{% extends 'base.html' %}

{% block title %}Reports{% endblock %}

{% block content %}
<h1>Reports</h1>

<h2>Donations by blood group</h2>

{% if rows %}
<table>
  <tr>
    <th>Blood group</th>
    <th>Donations</th>
  </tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.blood_group }}</td>
    <td>{{ r.total }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p class="empty">No donation data yet.</p>
{% endif %}
{% endblock %}
